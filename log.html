const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const salt=b64(SALT),iv=b64(IV),ct=b64(CT);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return new TextDecoder().decode(pt);
}
async function tryUnlock(pw,remember){
  try{const h=await unlock(pw);document.getElementById('gate').hidden=true;
      document.getElementById('log').innerHTML=h;
      if(remember){try{sessionStorage.setItem('oolog',pw)}catch(e){}}}
  catch(e){document.getElementById('err').textContent='That password did not work.';}
}
document.getElementById('eye').addEventListener('click',()=>{
  const i=document.getElementById('pw'),show=i.type==='password';
  i.type=show?'text':'password';document.getElementById('slash').style.display=show?'':'none';
  document.getElementById('eye').setAttribute('aria-label',show?'Hide password':'Show password');i.focus();});
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();tryUnlock(document.getElementById('pw').value,true)});
try{const s=sessionStorage.getItem('oolog');if(s)tryUnlock(s,false)}catch(e){}
</script>
